name: Build TripHisaab APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x triphisaab/gradlew

      - name: Build Debug APK
        run: |
          cd triphisaab
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build.log 2>&1 || {
            echo "GRADLE BUILD FAILED"
            tail -n 60 ../build.log
            cd ..
            git checkout -B debug-log
            git add build.log
            git -c user.name="CI" -c user.email="ci@github.com" commit -m "ci: debug build log"
            git push origin debug-log --force
            exit 1
          }

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          find triphisaab/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-output/TripHisaab-debug.apk \;
          echo "Found generated APK:"
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripHisaab-debug-apk
          path: build-output/TripHisaab-debug.apk
          retention-days: 30

      - name: Run Unit Tests
        run: |
          cd triphisaab
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: TripHisaab v1.0.0 (Build #${{ github.run_number }})
          body: |
            ### TripHisaab Native Android APK (Rework Deliverable)
            
            This release delivers the complete end-to-end rework of the **TripHisaab** native Android WhatsApp budget bot app:
            
            #### 1. Activation Rule: `@chat` Token Required
            - WhatsApp notifications are strictly processed **only** when they start with the `@chat` token (case-insensitive) and originate from the verified paired personal chat.
            - Unprefixed messages trigger 0 AI calls, 0 financial writes, 0 replies, 0 location captures, and 0 retained message text.
            - Sending bare `@chat` returns the interactive usage guide.
            
            #### 2. Unified Agent Pipeline
            - Replaced the separate read-only `BudgetChatManager` with a single unified, bounded tool-calling loop (max 3 iterations).
            - Removed boilerplate fallback errors (`"Based on your verified trip ledger, no active balance issue was found."`).
            - Automatically strips `<think>`, `<thought>`, and internal reasoning monologues from all output.
            
            #### 3. Authoritative Base Budget (100k vs 50k Bug Fixed)
            - Enforced a single authoritative active budget limit.
            - Commands like `@chat set total budget to 50,000` directly replace the base budget limit with full audit trail.
            
            #### 4. Real Cash-Flow Ledger
            - Expanded transaction model to support: `EXPENSE`, `INCOME`, `GIFT_RECEIVED`, `GIFT_SENT`, `LOAN_GIVEN`, `LOAN_RECEIVED`, `LOAN_REPAYMENT_RECEIVED`, `LOAN_REPAYMENT_PAID`, `REFUND_RECEIVED`, `TRANSFER_IN`, `TRANSFER_OUT`, `ADJUSTMENT`.
            - Authoritative formula: `Available funds = base budget + added funds - cash out`.
            
            #### 5. Accurate Place Queries & Blind Islamabad Backfill Bug Fixed
            - Place queries (e.g., `@chat Islamabad ka total kharcha`) return canonical place name, itemized entries, date range, and spending totals.
            - If no records exist, returns: `"Islamabad mein abhi koi recorded expense nahi hai."`.
            - Removed the legacy automatic fallback to Islamabad in database seeding.
            
            #### 6. Real-Time Location Freshness & Dashboard Card
            - Freshness measured against `elapsedRealtimeNanos`.
            - Dashboard Current Location Card displays Town/City, Fix Age, Accuracy, Provider, and interactive "Refresh Location" action.
            
            #### 7. 24 Categories & 300+ Hierarchical Leaves
            - Comprehensive taxonomy coverage with Roman Urdu and English aliases for motorcycle touring in Northern Pakistan.
            
            #### 8. Standard Deterministic Reply Formats
            - Strict compliance with Section 10 formatting for expenses, incoming funds, loans, and place summaries.
          files: build-output/TripHisaab-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
